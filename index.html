<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anshika Rai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{--teal:#0f766e;--teal-deep:#115e59;--offwhite:#faf7f2}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--teal);color:var(--offwhite);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Great Vibes',cursive;
  }
  .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
  .b1{width:280px;height:280px;top:-90px;left:-90px}
  .b2{width:180px;height:180px;top:20%;right:-60px}
  .b3{width:220px;height:220px;bottom:-80px;left:15%}
  .name{
    font-size:clamp(64px,14vw,150px);line-height:1.1;text-align:center;
    padding:0 20px;text-shadow:0 4px 0 rgba(0,0,0,.18);
  }
  .name span{display:inline-block;opacity:0;transform:translateY(40px) rotate(6deg) scale(.8);animation:rise .7s cubic-bezier(.2,.9,.3,1.2) forwards}
  .name span.space{width:.35em}
  @keyframes rise{to{opacity:1;transform:translateY(0) rotate(0) scale(1)}}
  .rule{
    width:0;height:3px;background:var(--offwhite);margin-top:26px;border-radius:2px;
    animation:grow .8s ease .9s forwards;
  }
  @keyframes grow{to{width:min(320px,60vw)}}
  .sub{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12px;font-weight:700;
    letter-spacing:.35em;text-transform:uppercase;margin-top:20px;opacity:0;
    animation:fade .6s ease 1.4s forwards;color:rgba(250,247,242,.85);
  }
  @keyframes fade{to{opacity:1}}
  .skip{
    position:absolute;bottom:34px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
    color:var(--offwhite);text-decoration:none;opacity:0;animation:fade .6s ease 1.6s forwards;
    border:2px solid rgba(250,247,242,.6);padding:10px 22px;border-radius:999px;
  }
  .skip:hover{background:var(--offwhite);color:var(--teal-deep)}
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <h1 class="name" id="name" aria-label="Anshika Rai"></h1>
  <div class="rule"></div>
  <div class="sub">Portfolio</div>
  <a class="skip" href="home.html">Enter →</a>
<script>
  const text = 'Anshika Rai';
  const el = document.getElementById('name');
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    if (ch === ' ') { s.className = 'space'; s.innerHTML = '&nbsp;'; }
    else { s.textContent = ch; s.style.animationDelay = (0.12 + i * 0.07) + 's'; }
    el.appendChild(s);
  });
  const GO = 'home.html';
  // Returning visitors in this tab session skip the splash.
  if (sessionStorage.getItem('splashed')) { location.replace(GO); }
  else {
    sessionStorage.setItem('splashed', '1');
    setTimeout(() => location.replace(GO), 3000);
  }
</script>
</body>
</html>
